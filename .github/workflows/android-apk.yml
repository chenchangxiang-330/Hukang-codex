name: Build HuKang Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools and NDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'

      - name: Install project dependencies
        run: npm ci

      - name: Check JavaScript and TypeScript
        run: |
          npm run typecheck
          npm test

      - name: Restore existing APK signing key
        env:
          HUKANG_DEBUG_KEYSTORE_B64: ${{ secrets.HUKANG_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$HUKANG_DEBUG_KEYSTORE_B64" ]; then
            echo 'Missing HUKANG_DEBUG_KEYSTORE_B64 repository secret; refusing to build an APK with a different signing key.' >&2
            exit 1
          fi
          printf '%s' "$HUKANG_DEBUG_KEYSTORE_B64" | base64 --decode > android/app/debug.keystore
          chmod 600 android/app/debug.keystore
          echo '221e0a3106aa4c3ccc154e0a418b55020b3f9ea6e84f92e8749cd9e2f39f5e58  android/app/debug.keystore' | sha256sum --check --status

      - name: Build signed release APK
        env:
          NODE_ENV: production
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          sha256sum android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: HuKang-OCR-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
